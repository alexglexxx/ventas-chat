# Esquema para Ventas-Chat (Taco Shop)

# Negocios (Tenants)
type Tenant @table {
  id: String! @default(expr: "uuidV4()")
  name: String!
  slug: String! @unique # Ejemplo: "tacos-el-guero"
  phoneNumber: String!
  primaryColor: String @default(value: "#000000")
  currency: String @default(value: "MXN")
  active: Boolean @default(value: true)
}

# Productos (Menú)
type Product @table {
  id: String! @default(expr: "uuidV4()")
  tenant: Tenant!
  name: String!
  description: String
  price: Float!
  category: String! # taco, bebida, extra, salsa
  imageUrl: String
  active: Boolean @default(value: true)
}

# Pedidos (Historial)
type Order @table {
  id: String! @default(expr: "uuidV4()")
  tenant: Tenant!
  customerName: String
  total: Float!
  status: String @default(value: "PENDING") # PENDING, COMPLETED, CANCELLED
  createdAt: Timestamp! @default(expr: "request.time")
}

# Detalles del Pedido (Relación muchos-a-muchos)
type OrderItem @table(key: ["order", "product"]) {
  order: Order!
  product: Product!
  quantity: Int!
  platterNumber: Int # Para la lógica de "Plato 1", "Plato 2"
}
