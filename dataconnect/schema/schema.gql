# Esquema Híbrido Universal: Ventas-Chat (Tacos + Citas)

# 1. El Negocio (Tenant)
type Business @table {
  id: String! @default(expr: "uuidV4()")
  name: String!
  slug: String! @unique
  phoneNumber: String!
  address: String
  businessType: String! # "TAQUERIA" o "SERVICIOS"
  
  # Configuración Visual y Moneda
  primaryColor: String @default(value: "#000000")
  currency: String @default(value: "MXN")
  
  # Integraciones
  googleCalendarId: String # ID del calendario del dueño
  whatsappToken: String # Token específico si se requiere
  
  active: Boolean @default(value: true)
}

# 2. MUNDO TAQUERÍA: Productos y Menú
type Product @table {
  id: String! @default(expr: "uuidV4()")
  business: Business!
  name: String!
  description: String
  price: Float!
  category: String! # taco, bebida, extra, salsa
  active: Boolean @default(value: true)
}

# 3. MUNDO SERVICIOS: Información y Citas
# (Solo descriptivo, no para carrito)
type ServiceInfo @table {
  id: String! @default(expr: "uuidV4()")
  business: Business!
  name: String!
  description: String
  price: Float
}

type Appointment @table {
  id: String! @default(expr: "uuidV4()")
  business: Business!
  customerName: String!
  customerPhone: String!
  serviceName: String # El servicio por el que pregunta
  startTime: Timestamp!
  googleEventId: String # Para sincronizar con Google Calendar
  status: String @default(value: "PENDING") # PENDING, CONFIRMED, CANCELLED
  createdAt: Timestamp! @default(expr: "request.time")
}

# 4. Horarios de Atención (Común para ambos)
type BusinessHours @table {
  id: String! @default(expr: "uuidV4()")
  business: Business!
  dayOfWeek: Int! # 0-6
  openTime: String! # "09:00"
  closeTime: String! # "18:00"
}
