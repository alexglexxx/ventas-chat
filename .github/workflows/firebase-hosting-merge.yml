name: "Production Deploy: Next.js + WhatsApp Bot"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📂 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Root Dependencies (Next.js)
        run: npm ci

      - name: 🤖 Install Functions Dependencies (WhatsApp Bot)
        # Este paso es vital para que Firebase pueda analizar tu webhook
        run: cd functions && npm install

      - name: 🛠️ Build Next.js
        # CRÍTICO: Aquí inyectamos las keys reales. 
        # Asegúrate de tener estos nombres en GitHub Secrets.
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "ventas-chat-d8518"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: 🔐 Authenticate with Google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: 🚀 Deploy to Firebase
        run: |
          npx firebase-tools deploy \
            --only hosting,functions \
            --force \
            --non-interactive \
            --project ventas-chat-d8518
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
