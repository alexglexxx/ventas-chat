name: "Production Deployment: Ventas-Chat"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 1. 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 2. 🟢 Setup Node.js (LTS 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. 📦 Install Dependencies
        run: npm ci

      - name: 4. ⚡ Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          # Genera un nuevo cache si cambian los locks o archivos fuente
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: 5. 🛠️ Build Application
        # Aquí inyectamos las variables de entorno necesarias para el empaquetado estático
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "ventas-chat-d8518"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: 6. 🔐 Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: 7. 🚀 Deploy to Firebase
        # Eliminamos --force. Si falla por Cleanup Policy, se debe ajustar el rol en Google Cloud Console.
        run: |
          npx firebase-tools deploy --only\
            --hosting,functions--force\
            --force\
            --non-interactive \
            --project ventas-chat-d8518
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
