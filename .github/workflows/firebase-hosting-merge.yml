name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci


      - name: Build with Next.js
        run: npm run build
        env:
          # Estas llaves "falsas" permiten que Next.js termine el build sin errores
          NEXT_PUBLIC_FIREBASE_API_KEY: "dummy-key-for-build-purposes"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "tu-proyecto.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "tu-proyecto-id"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "tu-proyecto.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "12345678"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:12345:web:abcde"

