      - uses: actions/checkout@v4
      
      # 1. Instalar Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Instalar las librerías (Esto evita el error 'next: not found')
      - run: npm ci

      # 3. Autenticar y bajar archivos de GCloud (Si los necesitas para el build)
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: gsutil cp gs://tu-bucket/archivo .

      # 4. Construir el proyecto
      - run: npm run build

      # 5. El paso de Firebase que ya tienes...
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VENTAS_CHAT }}'
          channelId: live
          projectId: ventas-chat
